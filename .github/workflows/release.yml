name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-24.04
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test "$(go env GOOS)-$(go env GOARCH)" = "$TARGET"
          go build -trimpath -o ipswrun ./cmd/ipswrun
          tar -czf "ipswrun-$TARGET.tar.gz" ipswrun LICENSE.md
      - uses: actions/upload-artifact@v4
        with:
          name: ipswrun-${{ matrix.target }}
          path: ipswrun-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ipswrun-*
          merge-multiple: true
          path: dist
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes *.tar.gz SHA256SUMS
