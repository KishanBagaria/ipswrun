name: Guests

# Builds the example guests, which need a Mac's compilers, and keeps them as an artifact for
# running under ipswrun anywhere else.
on:
  push:
    paths: [examples/**, emulator/**, .github/workflows/guests.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C examples
      # The same guests for iOS, against the iOS SDK that comes with Xcode, into examples/bin/ios.
      - run: make -k -C examples PLATFORM=ios
      - run: find examples/bin -type f | sort | xargs file && find examples/bin -type f | sort | xargs shasum -a 256
      # What these guests print on a real Mac, which is what they should print under ipswrun.
      - run: |
          for guest in threads swiftasync ipc; do
            examples/bin/$guest | tee native.txt && diff native.txt examples/expected/$guest/native.txt || exit
            # And every recorded run that got to the end printed exactly that.
            for run in examples/expected/$guest/*.json; do
              [ "$(jq .exit_code $run)" != 0 ] || jq -j .output $run | diff - native.txt || { echo $run; exit 1; }
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: guests
          path: examples/bin/
          if-no-files-found: error

  # Runs three guests against two releases on both kinds of host, with the same binaries, so that a
  # difference between hosts shows up as one.
  run:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: guests
          path: examples/bin
      - run: chmod +x examples/bin/*
      # What ipswrun fetched of the two releases, kept between runs: without it every run downloads
      # a few hundred megabytes of each from Apple.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ipswrun-matrix
          key: matrix-${{ runner.os }}-${{ hashFiles('examples/*.c', 'examples/*.m', 'examples/*.swift', 'examples/Makefile') }}
          restore-keys: matrix-${{ runner.os }}-
      - run: examples/matrix.sh --guest=crypto,threads,swiftasync,ipc,service,client,prefs,adi 15.0 27.2
        env:
          IPSWRUN_CACHE: ${{ runner.temp }}/ipswrun-matrix

  # TEMPORARY: looks into what stops the iOS guests on some releases.
  explore-ios:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: guests
          path: examples/bin
      - run: chmod +x examples/bin/* examples/bin/ios/*
      - run: go build -o ipswrun ./cmd/ipswrun && ./ipswrun --setup && ./ipswrun --device iPhone11,2 --releases
      - run: |
          url=$(./ipswrun --device iPhone11,2 --releases | awk '$2 == "22H390" {print $3}')
          go run ./cmd/ipswdebug iPhone11,2 "$url" /System/Library/PrivateFrameworks/CoreADI.framework /usr/libexec | grep -i "adi\|CoreADI" || true
          for build in 16G102 17H35; do
            url=$(./ipswrun --device iPhone11,2 --releases | awk -v b=$build '$2 == b {print $3}')
            go run ./cmd/ipswdebug iPhone11,2 "$url" / /System/Library/Caches /System/Library/Caches/com.apple.dyld /System/Library/dyld || true
          done
      - run: |
          for build in 19A346 21A329; do
            echo "=== $build"
            ./ipswrun --device iPhone11,2 $build examples/bin/ios/guest 2>&1 | grep -v "mach_vm_\(de\)\?allocate\|mach_vm_protect" | head -80 || true
            echo "=== $build traced"
            ./ipswrun --trace --device iPhone11,2 $build examples/bin/ios/guest 2>&1 | grep -v "mach_vm_\(de\)\?allocate\|mach_vm_protect" | tail -60 || true
          done
      - run: |
          echo "=== objcinfo"
          ./ipswrun --device iPhone11,2 22H390 examples/bin/ios/objcinfo /System/Library/PrivateFrameworks/IMCore.framework/IMCore 2>&1 | head -60 || true
          ./ipswrun --device iPhone11,2 22H390 examples/bin/ios/objcinfo /System/Library/Frameworks/Foundation.framework/Foundation 2>&1 | head -30 || true
          echo "=== swiftasync 18A373"
          ./ipswrun --device iPhone11,2 18A373 examples/bin/ios/swiftasync 2>&1 | head -30 || true
