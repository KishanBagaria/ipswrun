name: Guests

# Builds the example guests, which need a Mac's compilers, and keeps them as an artifact for
# running under ipswrun anywhere else.
on:
  push:
    paths: [examples/**, emulator/**, .github/workflows/guests.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C examples
      # The same guests for iOS, against the iOS SDK that comes with Xcode, into examples/bin/ios.
      - run: make -k -C examples PLATFORM=ios
      - run: |
          guests=$(find examples/bin -type f | sort)
          file $guests && shasum -a 256 $guests
      # What these guests print on a real Mac, which is what they should print under ipswrun.
      - run: |
          for guest in threads swiftasync ipc; do
            examples/bin/$guest | tee native.txt && diff native.txt examples/expected/$guest/native.txt || exit
            # And every recorded run that got to the end printed exactly that.
            for run in examples/expected/$guest/*.json; do
              [ "$(jq .exit_code $run)" != 0 ] || jq -j .output $run | diff - native.txt || { echo $run; exit 1; }
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: guests
          path: examples/bin/
          if-no-files-found: error

  # Runs the guests against two releases of macOS and three of iOS on both kinds of host, with the
  # same binaries, so that a difference between hosts shows up as one.
  run:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: guests
          path: examples/bin
      - run: chmod +x examples/bin/* examples/bin/ios/*
      # What ipswrun fetched of the releases, kept between runs: without it every run downloads
      # a few hundred megabytes of each from Apple. A cache is only saved when its key is new, so the
      # key changes with what decides what is fetched: the guests, the releases this file names and
      # the cache's own format. "packed" leaves out the caches of sparse files, which actions/cache
      # unpacks to their whole size, zeros and all.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ipswrun-matrix
          key: matrix-packed-${{ runner.os }}-${{ hashFiles('examples/*.c', 'examples/*.m', 'examples/*.swift', 'examples/Makefile', '.github/workflows/guests.yml', 'rangefs/cache.go') }}
          restore-keys: matrix-packed-${{ runner.os }}-
      - run: examples/matrix.sh --guest=crypto,threads,swiftasync,ipc,service,client,prefs,adi 15.0 27.2
        env:
          IPSWRUN_CACHE: ${{ runner.temp }}/ipswrun-matrix
      # The same guests built for iOS, against the first iOS release with all of them and the last
      # for each device (adi is not run on iOS).
      - run: examples/matrix.sh --device=iPhone11,2 --guest=crypto,threads,swiftasync,ipc,service,client,prefs 15.0 18.7
        env:
          IPSWRUN_CACHE: ${{ runner.temp }}/ipswrun-matrix
      - run: examples/matrix.sh --device=iPhone15,2 --guest=crypto,threads,swiftasync,ipc,service,client,prefs 27.2
        env:
          IPSWRUN_CACHE: ${{ runner.temp }}/ipswrun-matrix
