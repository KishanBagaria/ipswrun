name: Guests

# Builds the example guests, which need a Mac's compilers, and keeps them as an artifact for
# running under ipswrun anywhere else.
on:
  push:
    paths: [examples/**, emulator/**, .github/workflows/guests.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C examples
      - run: file examples/bin/* && shasum -a 256 examples/bin/*
      # What these guests print on a real Mac, which is what they should print under ipswrun.
      - run: |
          for guest in threads swiftasync; do
            examples/bin/$guest | tee native.txt && diff native.txt examples/expected/$guest/native.txt || exit
          done
      - uses: actions/upload-artifact@v4
        with:
          name: guests
          path: examples/bin/
          if-no-files-found: error

  # Runs one guest against two releases on both kinds of host, with the same binaries, so that a
  # difference between hosts shows up as one.
  run:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: guests
          path: examples/bin
      - run: chmod +x examples/bin/*
      - run: examples/matrix.sh --guest=crypto 15.0 27.2
      - run: examples/matrix.sh --guest=threads 15.0 27.2
