name: Guests

# Builds the example guests, which need a Mac's compilers, and keeps them as an artifact for
# running under ipswrun anywhere else.
on:
  push:
    paths: [examples/**, emulator/**, .github/workflows/guests.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C examples
      # The same guests for iOS, against the iOS SDK that comes with Xcode, into examples/bin/ios.
      - run: make -k -C examples PLATFORM=ios
      - run: file examples/bin/* examples/bin/ios/* && shasum -a 256 examples/bin/* examples/bin/ios/* 2>/dev/null
      # What these guests print on a real Mac, which is what they should print under ipswrun.
      - run: |
          for guest in threads swiftasync ipc; do
            examples/bin/$guest | tee native.txt && diff native.txt examples/expected/$guest/native.txt || exit
            # And every recorded run that got to the end printed exactly that.
            for run in examples/expected/$guest/*.json; do
              [ "$(jq .exit_code $run)" != 0 ] || jq -j .output $run | diff - native.txt || { echo $run; exit 1; }
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: guests
          path: examples/bin/
          if-no-files-found: error

  # Runs three guests against two releases on both kinds of host, with the same binaries, so that a
  # difference between hosts shows up as one.
  run:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: guests
          path: examples/bin
      - run: chmod +x examples/bin/*
      # What ipswrun fetched of the two releases, kept between runs: without it every run downloads
      # a few hundred megabytes of each from Apple.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ipswrun-matrix
          key: matrix-${{ runner.os }}-${{ hashFiles('examples/*.c', 'examples/*.m', 'examples/*.swift', 'examples/Makefile') }}
          restore-keys: matrix-${{ runner.os }}-
      - run: examples/matrix.sh --guest=crypto,threads,swiftasync,ipc,service,client,prefs,adi 15.0 27.2
        env:
          IPSWRUN_CACHE: ${{ runner.temp }}/ipswrun-matrix

  # TEMPORARY: runs every guest against the iOS releases, to record what they print.
  explore-ios:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: guests
          path: examples/bin
      - run: chmod +x examples/bin/* examples/bin/ios/*
      - run: examples/matrix.sh --device=iPhone11,2 --guest=all --stream-compressed --update --jobs=6 || true
        env:
          IPSWRUN_CACHE: ${{ runner.temp }}/cache
          RESULTS: ${{ runner.temp }}/results
      - run: examples/matrix.sh --device=iPhone15,2 --guest=all --update --jobs=6 26 27 || true
        env:
          IPSWRUN_CACHE: ${{ runner.temp }}/cache
          RESULTS: ${{ runner.temp }}/results
      - run: |
          for f in examples/expected/ios/*/*.json; do echo "== $f"; jq -c '{version, build, exit_code, output}' "$f"; done
      - run: |
          cd ${{ runner.temp }}/results
          for f in */*.err; do [ -s "$f" ] || continue; echo "== $f"; tail -n 25 "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-expected
          path: examples/expected/ios/
